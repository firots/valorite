[package]
name = "valorite"
description = "Valor UO Shard Launcher"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[package.metadata.winresource]
LegalCopyright = "Copyright © Valor UO Shard"
OriginalFilename = "valorite.exe"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
downloader = "0.2.7"
eframe = "0.26"
egui_extras = { version = "0.26", features = ["all_loaders"] }
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
env_logger = { version = "0.10", default-features = false, features = [
  "auto-color",
  "humantime",
] }
md5 = "0.7.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
self-replace = "1.3.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.112"
winresource = "0.1.17"
zip = "0.6.6"
log = "0.4"
egui = "0.26.0"

[build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "Valorite"
identifier = "com.valor.valorite"
icon = ["resources/uo.ico"]
version = "1.0.0"
resources = ["assets", "images/**/*.png", "secrets/public_key.txt"]
copyright = "Copyright (c) Valor UO Shard 2016. All rights reserved."
category = "Game"
short_description = "Valor UO Shard"
long_description = """
Valor UO Shard ClassicUO Client
"""
deb_depends = ["libgl1-mesa-glx", "libsdl2-2.0-0 (>= 2.0.5)"]
osx_frameworks = []
osx_url_schemes = ["com.tr.gen.valor"]
osx_minimum_system_version = "10.15"